<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>東京藝文 × 動漫活動週報｜歷史</title><style>:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dce3ee;--green:#14764a;--soft:#eaf7ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans TC","Noto Sans JP",sans-serif}.wrap{max-width:880px;margin:38px auto;padding:0 18px}.hero,.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#fff,#eaf7ef)}a{text-decoration:none}.back{display:inline-block;color:var(--green);margin-bottom:12px}.item{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:center}.date{font-weight:850;color:var(--green)}.meta{font-size:13px;color:var(--muted)}.btn{padding:9px 13px;border:1px solid var(--green);border-radius:10px;color:var(--green);font-weight:750}.notice{color:var(--muted)}@media(max-width:680px){.item{grid-template-columns:1fr}.btn{text-align:center}}</style></head><body><main class="wrap"><a class="back" href="../">← 返回最新活動</a><section class="hero"><h1>東京藝文 × 動漫活動週報</h1><p>歷史存檔共用同一個互動頁面，只切換日期資料。</p></section><section id="list"><div class="notice">載入中…</div></section></main><script>const list=document.getElementById('list');fetch('../manifest.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(m=>{const dates=[...(m.dates||[])].sort().reverse();list.innerHTML=dates.length?dates.map(d=>`<section class="item"><div class="date">${d}</div><div><b>${d===m.latest?'最新一期':'歷史週報'}</b><div class="meta">美術・展覽＋動漫・コラボ</div></div><a class="btn" href="../?date=${encodeURIComponent(d)}">開啟</a></section>`).join(''):'<div class="notice">尚無歷史資料。</div>'}).catch(e=>{list.innerHTML='<div class="notice">載入失敗：'+e.message+'</div>'});</script></body></html>
