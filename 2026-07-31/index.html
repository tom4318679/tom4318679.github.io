<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>每日英日趨勢學習 2026-07-31</title><style>:root{--bg:#f4f6fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dce3ee;--blue:#3159c8;--soft:#edf2ff;--green:#14764a;--gsoft:#eaf7ef;--purple:#6941c6;--psoft:#f2edff;--amber:#9a6700;--asoft:#fff6d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans TC','Noto Sans JP',sans-serif;line-height:1.72}a{color:var(--blue);text-decoration:none}button{font:inherit}header{position:sticky;top:0;z-index:10;background:#ffffffee;border-bottom:1px solid var(--line)}.head{max-width:1400px;margin:auto;padding:12px 18px;display:flex;justify-content:space-between;gap:12px}.tabs{display:flex;gap:8px}.tabs button{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:10px}.tabs .active{background:var(--soft);color:var(--blue);border-color:var(--blue)}.page{max-width:1400px;margin:16px auto;padding:0 18px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:13px}.hero{background:linear-gradient(135deg,#fff,#eef3ff)}.layout{display:grid;grid-template-columns:290px 1fr;gap:14px}nav{position:sticky;top:76px;height:calc(100vh - 92px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:9px;margin-bottom:4px}.nav span{display:block;color:var(--blue);font-size:11px;font-weight:800}.nav.active,.nav:hover{background:var(--soft);color:var(--blue)}.panel,.article{display:none}.panel.active,.article.active{display:block}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:12px}.level{background:var(--soft);color:var(--blue);padding:3px 8px;border-radius:999px;font-weight:800}.source{background:var(--gsoft);color:var(--green);padding:3px 8px;border-radius:999px;font-weight:800}.muted{color:var(--muted);font-size:12px}.why{border-left:4px solid var(--blue);background:#f8fafc;padding:10px}.url{display:inline-block;border:1px solid var(--blue);padding:8px 11px;border-radius:9px;font-weight:700}.translations{display:grid;grid-template-columns:1fr 1fr;gap:9px}.translation,.mini{border:1px solid var(--line);border-radius:10px;padding:11px}.translation h4{margin:0 0 5px;color:var(--muted)}.article-text p{font-size:16px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.consult{border-left:5px solid var(--purple);background:var(--psoft)}.insight{border-left:5px solid var(--amber);background:var(--asoft)}details{border:1px solid var(--line);border-radius:10px;padding:10px}footer{text-align:center;padding:20px;color:var(--muted)}@media(max-width:950px){.layout{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;overflow:auto}.nav{min-width:250px}}@media(max-width:700px){.head{flex-direction:column}.translations,.grid{grid-template-columns:1fr}}</style></head><body><header><div class="head"><div><h1>每日英日趨勢學習</h1><div class="muted">2026-07-31｜English 5＋日本語 3</div></div><div class="tabs"><button class="active" data-group="en">English 5</button><button data-group="jp">日本語 3</button></div></div></header><div class="page"><section class="hero"><h2>7/31 歷史晨報</h2><p>這個版本使用一般 JavaScript 資料檔，不使用 Base64、atob、gzip 或瀏覽器解壓縮。</p></section><div class="layout"><nav id="nav"></nav><main><section id="en" class="panel active"></section><section id="jp" class="panel"></section></main></div></div><footer><a href="/">最新晨報</a>　｜　<a href="/archive/">歷史列表</a></footer><script src="data.js?v=20260802-1"></script><script>const D=window.REPORT_DATA;if(!D){document.body.innerHTML='<main class="page"><section class="card"><h1>資料載入失敗</h1><p>請重新整理頁面。</p></section></main>';throw new Error('REPORT_DATA missing')}const nav=document.getElementById('nav'),en=document.getElementById('en'),jp=document.getElementById('jp');function vocab(rows,japanese){return `<div class="scroll"><table><thead><tr>${japanese?'<th>用語</th><th>讀音</th><th>中文</th>':'<th>Word</th><th>中文</th><th>日本語</th>'}</tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>`}function render(a,g,i){const isJ=g==='jp';const text=a.article.map(p=>`<p>${p}</p>`).join('');const trans=isJ?`<section class="card insight"><h3>繁體中文解說</h3><p>${a.zh}</p></section>`:`<section class="card"><h3>三語重點</h3><div class="translations"><div class="translation"><h4>繁中</h4><p>${a.zh}</p></div><div class="translation"><h4>日本語</h4><p>${a.ja}</p></div></div></section>`;const phrases=isJ?'':`<section class="card"><h3>Phrases</h3><div class="grid">${a.phrases.map(x=>`<div class="mini">${x}</div>`).join('')}</div></section>`;return `<article id="${a.id}" class="article ${i===0?'active':''}"><section class="card"><div class="meta"><span class="level">${a.level}</span><span class="source">${a.source}</span><span>${a.date}</span></div><h2>${a.title}</h2><div class="muted">${a.author}</div><p class="why"><b>選文理由：</b>${a.why}</p><a class="url" href="${a.url}" target="_blank" rel="noopener">原文 URL ↗</a><p class="muted">以下為 AI 重寫學習文章，不是原文全文。</p></section><section class="card article-text"><h3>${isJ?'AI学習用リライト':'AI Learning Article'}</h3>${text}</section>${trans}<section class="card"><h3>${isJ?'高階用語':'Vocabulary'}</h3>${vocab(isJ?a.terms:a.vocab,isJ)}</section>${phrases}<section class="card consult"><h3>${isJ?'コンサル表現':'Business / Consulting English'}</h3><ol>${a.consult.map(x=>`<li>${x}</li>`).join('')}</ol></section><section class="card"><details><summary>${isJ?'理解・口頭表達':'Comprehension & Output'}</summary><p>${a.question}</p></details></section></article>`}D.english.forEach((a,i)=>{nav.insertAdjacentHTML('beforeend',`<button class="nav ${i===0?'active':''}" data-id="${a.id}" data-group="en"><span>${a.level}</span>${a.title}</button>`);en.insertAdjacentHTML('beforeend',render(a,'en',i))});D.japanese.forEach((a,i)=>{nav.insertAdjacentHTML('beforeend',`<button class="nav" data-id="${a.id}" data-group="jp"><span>${a.level}</span>${a.title}</button>`);jp.insertAdjacentHTML('beforeend',render(a,'jp',i))});const tabs=[...document.querySelectorAll('.tabs button')],buttons=[...document.querySelectorAll('.nav')];function openArticle(id){document.querySelectorAll('.article').forEach(x=>x.classList.toggle('active',x.id===id));buttons.forEach(x=>x.classList.toggle('active',x.dataset.id===id));const g=id[0]==='e'?'en':'jp';document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===g));tabs.forEach(x=>x.classList.toggle('active',x.dataset.group===g));localStorage.setItem('report-2026-07-31-last',id)}buttons.forEach(x=>x.onclick=()=>openArticle(x.dataset.id));tabs.forEach(x=>x.onclick=()=>{const b=buttons.find(y=>y.dataset.group===x.dataset.group);if(b)openArticle(b.dataset.id)});const saved=localStorage.getItem('report-2026-07-31-last');if(saved&&document.getElementById(saved))openArticle(saved);</script></body></html>
