<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>每日英日趨勢學習 2026-08-01</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:80px auto;padding:24px;line-height:1.7}.box{border:1px solid #d9e0eb;border-radius:16px;padding:22px;background:#f8fafc}a{color:#3159c8}</style></head><body><div class="box"><h1>正在載入晨報…</h1><p>已修復資料編碼，第一次開啟可能需要數秒。</p></div><script>(async()=>{try{const ps=await Promise.all([1,2,3,4,5].map(async i=>{const r=await fetch(`part${i}.txt?v=20260802-2`,{cache:'no-store'});if(!r.ok)throw new Error(`part${i}: HTTP ${r.status}`);return (await r.text()).replace(/[^A-Za-z0-9+/=]/g,'')}));const joined=ps.join('');if(joined.length!==22584)throw new Error(`資料長度不符：${joined.length}；各段：${ps.map(x=>x.length).join(', ')}`);if(joined.length%4!==0)throw new Error(`Base64 長度不是 4 的倍數：${joined.length}`);const raw=atob(joined);const b=Uint8Array.from(raw,c=>c.charCodeAt(0));if(b[0]!==31||b[1]!==139)throw new Error('資料不是有效的 gzip 格式');if(!('DecompressionStream' in window))throw new Error('此瀏覽器不支援 DecompressionStream，請使用最新版 Chrome、Edge 或 Safari');const s=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(s)).text();if(!t.toLowerCase().includes('<!doctype html'))throw new Error('解壓後內容不是有效 HTML');document.open();document.write(t);document.close();}catch(e){document.body.innerHTML='<div class="box"><h1>無法載入</h1><p>'+String(e)+'</p><p>請先按 Ctrl+F5 強制重新整理。</p><p><a href="../archive/">返回歷史列表</a></p></div>';}})();</script></body></html>
