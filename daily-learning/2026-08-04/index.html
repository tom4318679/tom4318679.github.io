blue);font-weight:800}.why{border-left:4px solid var(--blue);background:#f8fafc;padding:10px}.sourcecard{border-left:5px solid var(--green);background:var(--gsoft)}.limit{border-left:5px solid var(--amber);background:var(--asoft)}.translations>div{display:none}.translations.show-en .en,.translations.show-zh .zh,.translations.show-ja .ja,.translations.show-all>div{display:block}.translations .zh,.translations .ja{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.speak{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 7px;cursor:pointer}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border:1px solid var(--line);border-radius:11px;padding:12px}.review{float:right}.review.on{background:#fff2b8}details{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.progress{height:9px;background:#e6ebf3;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#3159c8;width:0}.hidden{display:none}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{position:static;max-height:none;display:flex;overflow:auto}.nav button{min-width:240px}.grid2{grid-template-columns:1fr}}@media(max-width:640px){.wrap{padding:10px}.card{padding:14px}.top{position:static}}</style></head><body><div class="top"><a href="/">總入口</a><a href="/daily-learning/">學習中心</a><a href="/daily-learning/archive/">歷史</a><span class="spacer"></span><label>語速 <select id="rate"><option value="1">正常</option><option value="0.72">慢速</option></select></label><button id="stop">■ 停止</button><span id="voiceStatus">語音偵測中…</span></div><main class="wrap"><section class="hero"><div class="meta"><span class="pill">2026-08-04</span><span>English 5＋日本語 3</span></div><h1>每日英日趨勢學習</h1><p>AI、晶片、資料、政策與健康科技。文章為學習目的之 AI 重寫，來源事實、作者觀點與合理推論分開呈現。</p><div class="tabs"><button class="active" data-group="en">English 5</button><button data-group="jp">日本語 3</button></div><p>今日完成度</p><div class="progress"><i id="bar"></i></div></section><div class="layout"><aside class="nav" id="nav"></aside><section id="content"></section></div></main><script>const E=[{id:'e1',lv:'A2',title:'The United States funds new semiconductor research',src:'Reuters',author:'David Shepardson',date:'2026-07-30',url:'https://www.reuters.com/technology/us-signs-letters-intent-worth-874-million-boost-semiconductor-research-2026-07-30/',why:'用簡單英文理解政府補助、晶片研發與供應鏈安全。',body:[['The United States signed letters of intent worth $874 million with seven companies. The money is designed to support semiconductor research for artificial intelligence and advanced computing. The program is part of the CHIPS and Science Act.','美國與七家公司簽署總值 8.74 億美元的意向書，資金用於 AI 與先進運算相關的半導體研發，屬於《晶片與科學法》的一部分。','米国は7社と総額8億7400万ドルの意向書を交わした。資金はAIと先端計算向け半導体研究を支援し、CHIPS法の一部として実施される。'],['The government wants more chip technology to be developed inside the country. It also wants to reduce the risk of depending on a small number of overseas suppliers. Research support does not guarantee commercial success, however. Companies still need skilled workers, reliable factories, customers and competitive production costs.','政府希望更多晶片技術能在國內開發，並降低依賴少數海外供應商的風險。但研發補助不保證商業成功，企業仍需要人才、可靠工廠、客戶與具競爭力的製造成本。','政府は国内での技術開発を増やし、少数の海外供給者への依存リスクを下げたい。ただし研究支援は事業成功を保証しない。人材、安定した工場、顧客、競争力ある生産コストが必要だ。'],['For investors and suppliers, the next questions are simple: which projects reach pilot production, how much private money follows the public funding, and whether the new technology can be manufactured at scale.','投資人與供應商接下來應觀察：哪些專案進入試產、公共資金能帶動多少民間投資，以及新技術能否大規模製造。','投資家と供給企業が見るべき点は、試作段階に進む案件、民間資金の呼び込み、量産可能性である。']],words:[['incentive','n.','/ɪnˈsentɪv/','誘因、補助','奨励策','The incentive supports early research.'],['semiconductor','n.','/ˌsemikənˈdʌktər/','半導體','半導体','Semiconductors power AI systems.'],['domestic','adj.','/dəˈmestɪk/','國內的','国内の','domestic production'],['supplier','n.','/səˈplaɪər/','供應商','供給企業','overseas supplier'],['pilot production','n.','/ˈpaɪlət prəˈdʌkʃən/','試產','試作生産','reach pilot production'],['scale','n.','/skeɪl/','規模','規模','manufacture at scale'],['reliable','adj.','/rɪˈlaɪəbəl/','可靠的','信頼できる','reliable factories'],['commercial','adj.','/kəˈmɜːrʃəl/','商業的','商業的な','commercial success']],phr:['reduce dependence on','降低依賴','依存を減らす','The policy aims to reduce dependence on one supplier.'],facts:'Reuters 報導美國商務部與七家公司簽署總值 8.74 億美元的意向書。',view:'政策設計假設早期公共資金能降低高風險研發門檻。',infer:'真正產業效果取決於試產、民間配套資金與量產經濟性。',impact:'對日本與台灣供應鏈而言，美國研發補助既是合作機會，也是長期競爭壓力。',quality:'Reuters 公開報導；金額與公司安排可追溯至官方公告。',limits:'意向書不是最終撥款，也不能證明技術一定量產。'}, {id:'e2',lv:'B2',title:'China defends an industry-first economic model',src:'Reuters',author:'Joe Cash',date:'2026-08-02',url:'https://www.reuters.com/world/china/china-draws-red-lines-around-its-economic-model-ahead-eu-us-trade-talks-2026-08-02/',why:'理解中國產業政策、內需不足、貿易順差與歐美談判。',body:[['China is entering new trade talks with the United States and the European Union while defending an economic model that gives priority to industrial development. Western governments argue that heavy support for production, combined with weak household consumption, creates excess capacity and pushes low-priced exports into global markets. Beijing rejects that diagnosis and presents its model as a legitimate path to modernization.','中國在與美國、歐盟展開新一輪貿易談判之際，仍捍衛以產業發展為優先的經濟模式。歐美認為，生產端的大量支持與家庭消費偏弱結合，造成產能過剩並把低價出口推向全球。北京則拒絕此診斷。','中国は米欧との新たな通商協議を前に、産業発展を優先する経済モデルを擁護している。欧米は、生産支援と弱い家計消費の組み合わせが過剰生産と低価格輸出を生むと批判するが、中国側はその見方を退けている。'],['The disagreement is not only about tariffs. It concerns how growth should be distributed between factories, infrastructure, local governments and households. A shift toward consumption would require stronger social protection, higher household income and less reliance on property and industrial investment. Those changes could reduce trade tensions, but they would also weaken groups that benefit from the current allocation of credit and resources.','爭議不只是關稅，而是成長應如何在工廠、基礎設施、地方政府與家庭間分配。轉向消費需要更強社會保障、更高家庭所得，以及降低對房地產與產業投資依賴。','争点は関税だけではない。成長の果実を工場、インフラ、地方政府、家計の間でどう配分するかである。消費主導への転換には社会保障、家計所得、投資依存の見直しが必要だ。'],['Beijing appears to prefer gradual adjustment rather than a structural break. That strategy may preserve near-term stability and manufacturing competitiveness, but it also leaves foreign partners unconvinced. The key indicators are household consumption, industrial margins, export prices, local-government debt and whether negotiations produce measurable policy changes rather than broad statements.','北京似乎偏好漸進調整，而非結構性斷裂。這可維持短期穩定與製造競爭力，但難以消除外國疑慮。關鍵指標是家庭消費、工業利潤率、出口價格、地方債，以及談判是否帶來可衡量政策變化。','北京は構造的転換より段階的調整を選ぶ可能性が高い。短期安定と製造競争力を守れる一方、海外の懸念は残る。家計消費、企業利益率、輸出価格、地方債、具体的政策変更が観察点となる。']],words:[['overcapacity','n.','/ˌoʊvərkəˈpæsəti/','產能過剩','過剰生産能力','industrial overcapacity'],['household consumption','n.','/ˈhaʊshoʊld kənˈsʌmpʃən/','家庭消費','家計消費','weak household consumption'],['allocation','n.','/ˌæləˈkeɪʃən/','配置','配分','allocation of credit'],['structural','adj.','/ˈstrʌktʃərəl/','結構性的','構造的な','structural reform'],['legitimate','adj.','/lɪˈdʒɪtəmət/','正當的','正当な','legitimate path'],['margin','n.','/ˈmɑːrdʒɪn/','利潤率','利益率','industrial margins'],['measurable','adj.','/ˈmeʒərəbəl/','可衡量的','測定可能な','measurable change'],['trade surplus','n.','/treɪd ˈsɜːrpləs/','貿易順差','貿易黒字','large trade surplus']],phr:['draw a red line','劃定不可退讓界線','譲れない一線を引く','China drew a red line around its industrial model.'],facts:'Reuters 指出北京在美歐談判前強調政策延續，並拒絕外界對其經濟模式的部分批評。',view:'報導引用分析認為，中國訊息傳達更具自信，也在爭取時間與談判槓桿。',infer:'若內需改革幅度有限，貿易摩擦可能從關稅延伸至補貼、投資與產業安全。',impact:'日本企業需評估中國需求、低價出口競爭與供應鏈分散三者的共同影響。',quality:'Reuters 分析稿，結合政策文件、官方論述與多方分析。',limits:'談判尚未結束，政策表態不等於最終措施。'}, {id:'e3',lv:'B2',title:'NIH wants community-engaged AI to reduce health disparities',src:'NIH',author:'National Institutes of Health',date:'2026-07-20',url:'https://grants.nih.gov/funding/find-a-fit-for-your-research/highlighted-topics/112',why:'理解醫療 AI 如何從模型準確率走向篩檢、服藥與照護連續性。',body:[['The US National Institutes of Health has highlighted a research priority that combines artificial intelligence, data science and community engagement. The goal is to turn routinely collected clinical and community-linked data into timely actions for people who experience health disparities. Suggested outcomes include better screening completion, treatment adherence, disease control and continuity of care.','美國 NIH 提出一項結合 AI、資料科學與社區參與的研究重點，目標是把日常臨床資料與社區連結資料轉化為及時行動，改善弱勢族群的篩檢完成率、治療遵從性、疾病控制與照護連續性。','米国NIHは、AI、データ科学、地域参加を組み合わせる研究課題を示した。日常診療と地域データを行動につなげ、検診完了、治療継続、疾病管理、ケアの連続性を改善する狙いだ。'],['This emphasis changes the definition of a successful health-AI project. A model can be statistically accurate yet fail in practice if patients lack transportation, internet access, trust, language support or affordable follow-up care. Community-engaged research asks local organizations and patients to help define the problem, design the intervention and evaluate whether the system creates real benefits.','這改變了成功醫療 AI 的定義。模型即使統計上準確，若患者缺乏交通、網路、信任、語言支援或可負擔的後續照護，仍可能失敗。社區參與要求在地組織與患者共同定義問題、設計介入並評估實際效益。','この方針は医療AIの成功定義を変える。統計精度が高くても、交通、通信、信頼、言語支援、受診費用の壁があれば実装は失敗する。地域組織と患者が課題設定から評価まで関わる必要がある。'],['The initiative is a topic of interest rather than a single guaranteed funding award. Researchers still need to use an appropriate funding announcement and meet scientific and ethical requirements. Strong proposals should specify the target population, data quality, bias testing, privacy protection, workflow ownership and what happens when the model identifies a person at risk.','此項目是研究關注方向，不是保證撥款。研究者仍需透過適當資助公告申請並符合科學與倫理要求。強提案應明確說明目標族群、資料品質、偏誤測試、隱私、流程責任與風險識別後的處置。','これは関心領域であり、助成を保証するものではない。対象集団、データ品質、バイアス検証、プライバシー、業務責任、リスク検出後の対応を明確にする必要がある。']],words:[['disparity','n.','/dɪˈspærəti/','差距、不平等','格差','health disparity'],['adherence','n.','/ədˈhɪrəns/','遵從性','治療遵守','treatment adherence'],['continuity','n.','/ˌkɑːntəˈnuːəti/','連續性','継続性','continuity of care'],['intervention','n.','/ˌɪntərˈvenʃən/','介入','介入','design an intervention'],['workflow','n.','/ˈwɜːrkfloʊ/','工作流程','業務フロー','clinical workflow'],['bias','n.','/ˈbaɪəs/','偏誤','偏り','bias testing'],['routinely','adv.','/ruːˈtiːnli/','例行地','日常的に','routinely collected data'],['ethical','adj.','/ˈeθɪkəl/','倫理的','倫理的な','ethical requirements']],phr:['translate data into action','把資料轉化為行動','データを行動に変える','The project must translate data into action.'],facts:'NIH 於 2026-07-20 公布研究重點，鼓勵社區參與式 AI/ML 介入以改善健康差距。',view:'政策重點明顯偏向實際照護成果，而非只看模型指標。',infer:'醫療 AI 評估將更重視流程、可及性與介入後果。',impact:'對醫院與新創而言，需提前納入社區合作、偏誤檢驗與後續照護資源。',quality:'NIH 官方研究資助資訊，目的與適用範圍清楚。',limits:'這不是臨床試驗結果，也不是核准產品；尚無療效證據。'}, {id:'e4',lv:'B2',title:'Public biosignal data may be essential for safer medical LLMs',src:'npj Digital Medicine / PubMed',author:'James Anibal et al.',date:'2026-07-07',url:'https://pubmed.ncbi.nlm.nih.gov/42401685/',why:'理解生理訊號資料、公開基準、隱私與醫療 LLM 驗證。',body:[['Large language models are beginning to work with biosignals such as electrocardiograms, medical images and physiological time series. A recent open-access perspective argues that public biosignal datasets are needed to support safe research, shared benchmarks and reproducible evaluation. Without common data, each company can test on private datasets that may hide weaknesses or make results difficult to compare.','大型語言模型開始處理心電圖、醫療影像與生理時間序列。近期開放取用觀點文章主張，需要公開生理訊號資料集來支援安全研究、共同基準與可重現評估。缺乏共同資料時，各公司可能只在私有資料測試，弱點難以揭露。','LLMは心電図、医用画像、生理時系列を扱い始めている。公開論考は、安全な研究、共通ベンチマーク、再現可能な評価のために公開生体信号データが必要だと論じる。'],['Public data can improve transparency, but it also creates privacy and governance challenges. Biosignals may contain identifying patterns, rare conditions or information that was never intended for broad AI training. Good data governance therefore requires consent rules, de-identification, controlled access, documentation and oversight that matches the sensitivity of the dataset.','公開資料可提高透明度，但也帶來隱私與治理挑戰。生理訊號可能包含可識別模式、罕見疾病或原本未預期用於廣泛 AI 訓練的資訊。良好治理需包含同意規則、去識別化、控管存取、文件與監督。','公開データは透明性を高める一方、プライバシーとガバナンスの課題を生む。本人同意、匿名化、アクセス管理、文書化、監督が必要になる。'],['The article is a policy and research argument, not evidence that a specific medical LLM is safe. The practical next step is to build datasets that are diverse enough to test generalization while protecting participants. Researchers should report subgroup performance, missing-data patterns, device differences and failure modes rather than publishing only an average score.','此文是政策與研究主張，不是特定醫療 LLM 安全性的證據。下一步是建立足以測試泛化、又能保護參與者的多元資料集，並報告族群表現、缺失資料、裝置差異與失敗模式。','本稿は政策・研究上の主張であり、特定モデルの安全性を示すものではない。多様性と参加者保護を両立したデータセット、集団別性能、欠測、機器差、失敗例の報告が必要だ。']],words:[['biosignal','n.','/ˈbaɪoʊˌsɪɡnəl/','生理訊號','生体信号','biosignal dataset'],['benchmark','n.','/ˈbentʃmɑːrk/','基準','ベンチマーク','shared benchmark'],['reproducible','adj.','/ˌriːprəˈduːsəbəl/','可重現的','再現可能な','reproducible evaluation'],['de-identification','n.','/diː aɪˌdentɪfɪˈkeɪʃən/','去識別化','匿名化','data de-identification'],['oversight','n.','/ˈoʊvərsaɪt/','監督','監督','ethical oversight'],['generalization','n.','/ˌdʒenərəlaɪˈzeɪʃən/','泛化','汎化','test generalization'],['subgroup','n.','/ˈsʌbɡruːp/','子群體','部分集団','subgroup performance'],['failure mode','n.','/ˈfeɪljər moʊd/','失敗模式','故障様式','document failure modes']],phr:['hide weaknesses','掩蓋弱點','弱点を隠す','Private tests can hide weaknesses.'],facts:'開放取用文章主張公開生理訊號資料有助於醫療 LLM 的研究與基準測試。',view:'作者認為缺少公開資料會削弱比較性與安全研究。',infer:'未來醫療模型採購可能要求更完整的外部驗證與子群體報告。',impact:'對患者有潛在安全利益，但資料公開必須搭配嚴格隱私治理。',quality:'同儕審閱、開放取用的 npj Digital Medicine 論考；PubMed 可檢索。',limits:'屬觀點／政策文章，沒有新臨床試驗或產品療效結果。'}, {id:'e5',lv:'C1',title:'AI demand may create a new kind of inflation shock for Japan',src:'Reuters / Bank of Japan',author:'Leika Kihara',date:'2026-08-03',url:'https://www.reuters.com/world/asia-pacific/boj-says-global-ai-demand-could-have-sticky-inflationary-effect-2026-08-03/',why:'把 AI 資本支出、能源、晶片、日圓與日本物價放進同一個宏觀框架。',body:[['The Bank of Japan has added an unusual risk to its inflation analysis: the global race to build artificial-intelligence infrastructure. In its quarterly outlook, the central bank argued that AI may eventually raise productivity and reduce costs, but the near-term investment boom can operate like a positive global demand shock. Data centers, chips, electricity equipment and construction resources are being purchased faster than supply can expand, creating price pressure before productivity gains are fully realized.','日本銀行在通膨分析中加入一項不尋常風險：全球 AI 基礎設施競賽。日銀認為 AI 長期可能提高生產力並降低成本，但短期投資熱潮會像全球正向需求衝擊，資料中心、晶片、電力設備與建設資源的需求增速快於供給。','日本銀行はインフレ分析に、世界的なAIインフラ投資競争という新しいリスクを加えた。長期的には生産性向上がコストを下げ得る一方、短期の投資ブームは世界的な需要ショックとして価格を押し上げる。'],['For Japan, the transmission channel is especially important because the country imports much of its energy and many intermediate goods. Strong global demand can raise the prices of memory, power equipment, oil and specialized machinery. A weak yen amplifies those increases when they are converted into local currency. Companies then decide whether to absorb the costs, reduce margins, postpone investment or pass prices on to households. The result can be persistent inflation even when domestic consumer demand is not exceptionally strong.','對日本而言，傳導管道特別重要，因為能源與許多中間財仰賴進口。全球需求推高記憶體、電力設備、石油與專用機械價格，弱日圓又放大本幣成本。企業需選擇吸收成本、壓縮利潤、延後投資或轉嫁家庭。','日本はエネルギーと中間財の輸入依存度が高い。世界需要がメモリー、電力設備、原油、専用機械の価格を上げ、円安が円換算コストを増幅する。企業はコスト吸収、利益圧縮、投資延期、価格転嫁の選択を迫られる。'],['This creates a difficult policy problem. If the BOJ focuses only on weak domestic spending, it may underestimate externally generated inflation. If it tightens too quickly, however, it could damage households and smaller firms before wage growth becomes broad enough to offset higher prices. The bank must distinguish temporary commodity shocks from a more durable reallocation of global capital toward AI infrastructure. That distinction depends on wages, service prices, inflation expectations, exchange rates and evidence that companies can continue passing costs through.','這形成困難政策問題。若日銀只看疲弱內需，可能低估外生通膨；若過快緊縮，又可能在薪資尚未普遍上升前傷害家庭與中小企業。日銀需區分暫時商品衝擊與全球資本長期轉向 AI 基礎設施。','政策判断は難しい。内需の弱さだけを見れば外生的インフレを過小評価し得るが、急な引き締めは賃金上昇が広がる前に家計と中小企業を傷つける。商品市況の一時的変動とAI投資への持続的資本移動を区別する必要がある。'],['The BOJ also noted that higher interest rates do not affect all households in the same way. Japan has far more household deposits than household debt, so savers may receive more interest income while borrowers face higher payments. Distribution therefore matters as much as the average effect. For residents, the practical questions are whether wages keep pace with food and utility bills, whether deposit rates rise meaningfully, and whether mortgage or business-loan costs increase faster than income.','日銀也指出，升息對家庭影響不一。日本家庭存款遠高於負債，儲蓄者可能增加利息收入，借款人則面臨更高付款。居民應觀察薪資是否追上食品與水電、存款利率是否實質提高，以及房貸與企業貸款成本是否快於收入。','利上げの影響は家計ごとに異なる。預金が負債を大きく上回るため、預金者は利息収入が増える一方、借り手は返済負担が増す。賃金、生活費、預金金利、住宅・事業ローンの関係が重要だ。']],words:[['sticky','adj.','/ˈstɪki/','黏著、難下降的','粘着的な','sticky inflation'],['transmission channel','n.','/trænzˈmɪʃən ˈtʃænəl/','傳導管道','波及経路','inflation transmission channel'],['intermediate goods','n.','/ˌɪntərˈmiːdiət ɡʊdz/','中間財','中間財','imported intermediate goods'],['amplify','v.','/ˈæmplɪfaɪ/','放大','増幅する','amplify cost increases'],['absorb','v.','/əbˈzɔːrb/','吸收','吸収する','absorb higher costs'],['pass through','v.','/pæs θruː/','轉嫁','転嫁する','pass costs through'],['durable','adj.','/ˈdʊrəbəl/','持久的','持続的な','durable shift'],['reallocation','n.','/ˌriːæləˈkeɪʃən/','重新配置','再配分','capital reallocation'],['distributional','adj.','/ˌdɪstrɪˈbjuːʃənəl/','分配面的','分配上の','distributional effects'],['offset','v.','/ˈɔːfset/','抵銷','相殺する','offset higher prices']],phr:['operate like a demand shock','像需求衝擊般運作','需要ショックとして作用する','AI investment can operate like a demand shock.'],facts:'Reuters 引述日銀展望報告，指出全球 AI 需求可能在短期推高成本並形成較持久的通膨壓力。',view:'日銀同時承認 AI 長期生產力效益與短期需求衝擊，並非單向悲觀。',infer:'AI 投資可能使日本通膨更受全球設備、能源與匯率影響。',impact:'日本居民需關注實質薪資、存款利率與借貸成本的分配差異。',quality:'Reuters 報導搭配日銀季度展望，屬高可信政策與新聞來源。',limits:'這是風險情境與政策分析，不代表 AI 已被證明是當前通膨的主要因果來源。'}];const J=[{id:'j1',lv:'N1+',title:'AI需要は日本の物価をどう変えるのか',src:'日本銀行／Reuters',author:'日本銀行・木原麗花',date:'2026-08-03',url:'https://www.reuters.com/world/asia-pacific/boj-says-global-ai-demand-could-have-sticky-inflationary-effect-2026-08-03/',why:'金融政策、輸入物価、円安、家計への波及を一つの流れで説明する。',jp:'日本銀行は、世界的なAI投資が日本の物価に及ぼす影響を新たなリスクとして明示した。AIは長期的には生産性を高め、コスト低下をもたらす可能性がある。しかし短期では、データセンター、半導体、電力設備、建設資材への需要が供給能力を上回り、世界的な需要ショックとして価格を押し上げる。日本はエネルギーや中間財の輸入依存度が高いため、海外価格の上昇が国内に伝わりやすい。さらに円安が重なると、企業の円建て調達コストは一段と上がる。企業はコストを吸収して利益率を下げるか、投資を延期するか、販売価格へ転嫁するかを迫られる。ここで重要なのは、国内消費が強くなくてもインフレが長引く可能性がある点だ。金融政策では、外部要因による一時的な価格上昇と、AI投資を背景にした持続的な資本配分の変化を区別しなければならない。判断材料は賃金、サービス価格、期待インフレ率、為替、企業の価格転嫁力である。利上げの家計影響も一様ではない。預金を多く持つ世帯は利息収入が増える一方、住宅ローンや事業融資を抱える世帯は負担が増す。平均値だけでなく分配面を見る必要がある。',zh:'日銀把 AI 基礎設施投資視為可能的全球需求衝擊。日本因能源與中間財進口依賴高，價格會透過匯率與企業轉嫁影響居民。政策上必須區分短期商品波動與長期資本重配。',terms:[['需要ショック','じゅようショック','需求衝擊','需要の急変','景気循環より外生的な響き'],['価格転嫁','かかくてんか','價格轉嫁','コストを販売価格に反映','企業分析で頻出'],['輸入依存度','ゆにゅういぞんど','進口依賴度','海外調達比率','構造的弱点を示す'],['基調的','きちょうてき','基礎趨勢的','一時要因を除いた','政策文書の硬い表現'],['分配面','ぶんぱいめん','分配層面','家計別の影響','平均値への対比']],coll:'価格を押し上げる／コストを吸収する／利益率を圧迫する／影響が一様ではない',quality:'日銀政策資料とReuters報道。政策当局の問題意識を直接確認できる。',limits:'将来リスクの分析であり、AI需要が現在の物価上昇をどの程度説明するかは確定していない。'}, {id:'j2',lv:'専門',title:'医療LLMに公開生体信号データが必要な理由',src:'npj Digital Medicine',author:'James Anibalほか',date:'2026-07-07',url:'https://pubmed.ncbi.nlm.nih.gov/42401685/',why:'AI評価、公開ベンチマーク、匿名化、サブグループ検証を学ぶ。',jp:'医療分野では、大規模言語モデルが文章だけでなく、心電図、画像、生理時系列などの生体信号を扱い始めている。公開論考は、安全性と再現性を高めるために公開データセットが必要だと主張する。企業ごとに非公開データで評価すると、モデル間比較が難しくなり、弱点や失敗条件が見えにくい。共通ベンチマークがあれば、同じ条件で性能、頑健性、サブグループ差を検証できる。一方、生体信号は個人識別につながる可能性があり、希少疾患や同意範囲外の情報を含むこともある。したがって公開は無条件で行うべきではない。本人同意、匿名化、アクセス制御、利用目的、監査、削除手続を組み合わせる必要がある。さらに平均精度だけでは安全性を評価できない。年齢、性別、民族、機器、医療機関、欠測の違いによる性能変化を報告し、どの条件で誤るかを明示すべきだ。本稿は特定製品の有効性を示す臨床試験ではなく、研究基盤の整備を求める政策的提言である。実装時には、モデルが危険を検出した後に誰が確認し、患者へどう介入するかという業務設計も欠かせない。',zh:'文章主張公開生理訊號資料可提高醫療 LLM 的比較性與安全性，但公開必須配合同意、去識別化、存取控制與子群體驗證。這是研究政策觀點，不是產品療效證明。',terms:[['生体信号','せいたいしんごう','生理訊號','バイオシグナル','医学・工学の専門語'],['匿名化','とくめいか','去識別化','個人識別情報の除去','完全匿名との違いに注意'],['頑健性','がんけんせい','穩健性','ロバスト性','モデル評価の硬い表現'],['欠測','けっそく','缺失資料','データ欠損','統計・医療研究で使用'],['再現性','さいげんせい','可重現性','同条件で結果を再現','研究品質の基本']],coll:'弱点を可視化する／同じ条件で比較する／利用目的を限定する／失敗条件を明示する',quality:'査読済み・オープンアクセスの専門誌論考。PubMedで検索可能。',limits:'意見・政策提言であり、新規臨床試験ではない。'}, {id:'j3',lv:'N1',title:'「便利なAI」だけでは健康格差は縮まらない',src:'米国国立衛生研究所 NIH',author:'NIH',date:'2026-07-20',url:'https://grants.nih.gov/funding/find-a-fit-for-your-research/highlighted-topics/112',why:'社会トレンドとして、AI導入と地域参加、信頼、アクセス格差を考える。',jp:'AIを医療へ導入すれば、健康格差が自動的に縮まるわけではない。NIHが示した研究課題は、臨床データと地域データを活用しながら、住民や地域組織を研究設計に参加させることを重視している。モデルが高精度でも、患者に交通手段がない、通信環境が弱い、言語支援がない、医療機関への不信がある、追加費用を払えないといった問題が残れば、受診や治療にはつながらない。したがって成果指標もAUCや正解率だけでは不十分である。検診完了率、服薬継続、疾病管理、受診中断の減少など、生活に近い結果を見る必要がある。地域参加型研究では、住民を単なるデータ提供者として扱わず、課題設定、介入方法、説明文、評価基準を共に設計する。これは研究に時間がかかるという弱点もあるが、現場に受け入れられないシステムを作るリスクを下げる。雑談でこのテーマを扱う際は、「AIは便利か」という二択ではなく、「誰に届き、誰が取り残されるか」「異常を検出した後に支援できるか」と問い直すと議論が深まる。',zh:'NIH 強調社區參與式 AI。模型準確不代表能改善健康結果，仍要處理交通、網路、語言、信任與費用障礙，並用篩檢完成率、服藥與照護連續性衡量。',terms:[['地域参加型','ちいきさんかがた','社區參與式','住民参加型','研究方法の表現'],['受診中断','じゅしんちゅうだん','中斷就醫','通院中断','医療アクセスの問題'],['取り残す','とりのこす','遺漏、落下','対象外にする','社会課題でよく使う'],['成果指標','せいかしひょう','成果指標','アウトカム指標','KPIより公共政策的'],['当事者','とうじしゃ','當事人','影響を受ける本人','参加設計で重要']],coll:'格差を縮める／受診につなげる／当事者の声を反映する／誰が取り残されるか',quality:'NIH公式の研究関心領域。目的、対象成果、申請上の位置づけが明確。',limits:'研究募集の方向性であり、介入効果を示す結果ではない。'}];const ALL=[...E,...J];let group='en',current='e1',lang='all';const synth=window.speechSynthesis;let voices=[];const rate=document.getElementById('rate');rate.value=localStorage.getItem('dl-rate')||'1';rate.onchange=()=>localStorage.setItem('dl-rate',rate.value);document.getElementById('stop').onclick=()=>synth&&synth.cancel();function refreshVoices(){voices=synth?synth.getVoices():[];const en=voices.some(v=>v.lang?.startsWith('en')),ja=voices.some(v=>v.lang?.startsWith('ja'));document.getElementById('voiceStatus').textContent=!synth?'此裝置不支援語音':`英文${en?'✓':'—'}・日文${ja?'✓':'—'}`}if(synth)synth.onvoiceschanged=refreshVoices;refreshVoices();function speak(t,l){if(!synth){alert('此裝置沒有可用語音');return}synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=+rate.value;const pref=localStorage.getItem('dl-voice-'+l);u.voice=voices.find(v=>v.name===pref)||voices.find(v=>v.lang?.toLowerCase().startsWith(l.slice(0,2).toLowerCase()))||null;if(u.voice)localStorage.setItem('dl-voice-'+l,u.voice.name);synth.speak(u)}function b(t,l){return `<button class="speak" aria-label="播放 ${t.replace(/"/g,'')}" data-speak="${t.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" data-lang="${l}">🔊</button>`}function nav(){const arr=group==='en'?E:J;document.getElementById('nav').innerHTML=arr.map(x=>`<button class="${x.id===current?'active':''}" data-id="${x.id}"><small>${x.lv}</small>${x.title}</button>`).join('')}function common(x){return `<section class="card"><button class="review ${localStorage.getItem('review-'+x.id)?'on':''}" data-review="${x.id}">★ 待複習</button><div class="meta"><span class="pill">${x.lv}</span><span>${x.src}</span><span>${x.author}</span><span>${x.date}</span></div><h2>${x.title}</h2><p class="why"><b>選文理由：</b>${x.why}</p><p><a href="${x.url}" target="_blank" rel="noopener">原文 URL ↗</a></p></section>`}function renderE(x){const rows=x.words.map(w=>`<tr><td><b>${w[0]}</b> ${b(w[0],'en-US')}</td><td>${w[1]}</td><td>${w[2]}</td><td>${w[3]}</td><td>${w[4]}</td><td>${w[5]} ${b(w[5],'en-US')}</td></tr>`).join('');const body=x.body.map(p=>`<section class="card translations show-${lang}"><div class="en"><b>AI learning article</b><p>${p[0]}</p>${b(p[0],'en-US')}</div><div class="zh"><b>繁體中文</b><p>${p[1]}</p></div><div class="ja"><b>自然日文</b><p>${p[2]}</p>${b(p[2],'ja-JP')}</div></section>`).join('');return common(x)+`<section class="card"><div class="langs"><button data-langview="en">English</button><button data-langview="zh">繁中</button><button data-langview="ja">日本語</button><button data-langview="all">全部</button></div></section>${body}<section class="card"><h3>Vocabulary</h3><div class="scroll"><table><tr><th>Word</th><th>詞性</th><th>IPA</th><th>中文</th><th>日本語</th><th>文章用法</th></tr>${rows}</table></div></section><section class="card"><h3>Phrases／固定搭配</h3><p><b>${x.phr[0]}</b> ${b(x.phr[0],'en-US')}<br>${x.phr[1]}／${x.phr[2]}<br>${x.phr[3]} ${b(x.phr[3],'en-US')}</p></section><section class="card"><h3>文法／長句拆解</h3><details><summary>因果與讓步</summary><p>先找主句，再標記 because, while, although, if。把政策動作、傳導機制與限制分成三層。</p></details><details><summary>商務表達</summary><ol><li>The key issue is not X alone, but how X affects Y.</li><li>We should separate the near-term effect from the structural effect.</li><li>The evidence supports a cautious interpretation rather than a definitive conclusion.</li></ol></details></section><section class="card grid2"><div class="mini"><h3>繁中內容解讀</h3><p><b>來源事實：</b>${x.facts}</p><p><b>作者觀點：</b>${x.view}</p><p><b>合理推論：</b>${x.infer}</p><p><b>影響：</b>${x.impact}</p></div><div class="mini sourcecard"><h3>來源品質卡</h3><p>${x.quality}</p><div class="limit"><b>限制：</b>${x.limits}</div></div></section><section class="card"><h3>理解與輸出</h3><details><summary>Q1：文章的核心因果鏈是什麼？</summary><p>答案：從政策或需求變化，經成本、行為或流程，最後影響企業、居民或市場。</p></details><details><summary>Q2：最重要的限制是什麼？</summary><p>答案：${x.limits}</p></details><details><summary>英文輸出題</summary><p>Use 80–120 words to explain one implication and one risk.</p></details></section>`}function renderJ(x){const rows=x.terms.map(t=>`<tr><td><b>${t[0]}</b> ${b(t[0],'ja-JP')}</td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td></tr>`).join('');return common(x)+`<section class="card"><h3>AI学習用リライト</h3><p>${x.jp}</p>${b(x.jp,'ja-JP')}</section><section class="card"><h3>精準繁中解說</h3><p>${x.zh}</p></section><section class="card"><h3>高階用語</h3><div class="scroll"><table><tr><th>用語</th><th>假名</th><th>中文</th><th>近義替換</th><th>語感</th></tr>${rows}</table></div></section><section class="card"><h3>固定搭配</h3><p>${x.coll.split('／').map(y=>`${y} ${b(y,'ja-JP')}`).join('<br>')}</p><p><b>不自然用法：</b>抽象名詞を重ねすぎず、「何が・何に・どう影響するか」を明示する。</p></section><section class="card"><h3>長句拆解・コンサル表現</h3><details><summary>長句拆解</summary><p>主題→背景→因果→制約→結論の順に分ける。修飾節を先に訳しすぎない。</p></details><ol><li>結論から申し上げると、論点は二つあります。</li><li>短期影響と構造変化を切り分ける必要があります。</li><li>現時点では断定せず、追加データを確認すべきです。</li><li>実装上のボトルネックは技術より運用設計です。</li></ol></section><section class="card grid2"><div class="mini"><h3>会話訓練</h3><p><b>開場：</b>最近このテーマが気になっているのですが。／少し実務寄りの観点で見ると。</p><p><b>追問：</b>それは誰に最も影響しますか。／前提が変わると結論も変わりますか。</p><p><b>礼貌反對：</b>その見方も理解できますが、現時点では別の可能性も残ると思います。</p><p><b>雑談の種：</b>生活への影響／仕事での応用／海外との違い</p></div><div class="mini sourcecard"><h3>來源品質卡</h3><p>${x.quality}</p><div class="limit"><b>限制：</b>${x.limits}</div></div></section><section class="card"><h3>要約・理解</h3><details><summary>100字要約</summary><p>${x.jp.slice(0,100)}…</p></details><details><summary>50字要約</summary><p>${x.zh.slice(0,50)}…</p></details><details><summary>1句要約</summary><p>${x.title}について、背景・因果・制約を整理した。</p></details><details><summary>理解題</summary><p>中心論点と最重要の制約を口頭で説明してください。</p></details></section>`}function render(){nav();const x=ALL.find(a=>a.id===current);document.getElementById('content').innerHTML=`<article class="article active">${group==='en'?renderE(x):renderJ(x)}</article>`;document.querySelectorAll('.tabs button').forEach(z=>z.classList.toggle('active',z.dataset.group===group));progress()}function progress(){const done=ALL.filter(x=>localStorage.getItem('done-'+x.id)).length;document.getElementById('bar').style.width=(done/ALL.length*100)+'%'}document.addEventListener('click',e=>{const s=e.target.closest('[data-speak]');if(s){speak(s.dataset.speak,s.dataset.lang);return}const id=e.target.closest('[data-id]')?.dataset.id;if(id){synth&&synth.cancel();current=id;localStorage.setItem('done-'+id,'1');render();return}const g=e.target.closest('[data-group]')?.dataset.group;if(g){synth&&synth.cancel();group=g;current=(g==='en'?E[0]:J[0]).id;render();return}const l=e.target.closest('[data-langview]')?.dataset.langview;if(l){lang=l;render();return}const r=e.target.closest('[data-review]')?.dataset.review;if(r){const k='review-'+r;if(localStorage.getItem(k))localStorage.removeItem(k);else localStorage.setItem(k,'1');render()}});render();window.addEventListener('beforeunload',()=>synth&&synth.cancel());</script></body></html>
