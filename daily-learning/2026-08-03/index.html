>學習進度 0/8</span><span>內容均為 AI learning article／AI学習用リライト，非原文逐字轉載。</span></div></section><div class="tabs"><button class="active" data-panel="en">English 5</button><button data-panel="jp">日本語 3</button></div><div class="layout"><aside class="nav" id="nav"></aside><section id="en" class="panel active"></section><section id="jp" class="panel"></section></div></main><footer class="footer">來源日期與網址皆於 2026-08-03 查核；前往原文前請留意來源後續更正。</footer><script>
const items=[
{id:'e1',g:'en',lv:'A2',title:'Japan’s earthquake tests factories and supply chains',source:'Reuters',author:'Reuters reporters',date:'2026-07-31',mins:'5 min',url:'https://www.reuters.com/world/asia-pacific/death-toll-japan-earthquake-rises-34-2026-07-31/',why:'以較簡單英文理解地震如何影響汽車、晶片與日常供應。',body:[`A powerful earthquake in southern Japan stopped work at several car and semiconductor plants. Companies first checked workers, buildings, clean rooms and power systems. Some factories restarted part of their operations after inspections, while others waited for parts, water or transport routes to recover.`,`The event matters beyond the local area. Kyushu is an important center for auto parts and chips. When one supplier stops, factories in other regions may also slow down because modern production depends on tightly timed deliveries. However, companies said that upgrades made after earlier earthquakes helped reduce damage.`,`The main question is not only how quickly each plant restarts. Analysts will also watch whether hidden equipment damage, aftershocks or logistics problems create a second wave of delays. For residents, stable electricity, water and safe shelters remain more urgent than corporate output.`],zh:[`日本南部強震迫使多家汽車與半導體工廠停工。企業先確認人員、建物、無塵室與電力系統；部分工廠檢查後局部復產，另一些仍等待零件、供水或交通恢復。`,`九州是汽車零件與晶片的重要基地，因此單一供應商停擺也可能拖慢其他地區工廠。不過，過去震災後的耐震與備援投資似乎降低了損害。`,`後續重點是設備暗傷、餘震與物流是否造成第二波延誤。對居民而言，電力、供水與避難環境仍比產量更急迫。`],ja:[`九州南部の地震により、自動車・半導体工場が相次いで稼働を停止した。各社は従業員、建物、クリーンルーム、電力設備を点検し、一部は段階的に再開した。`,`九州は部品と半導体の集積地であり、一社の停止が遠隔地の工場にも波及し得る。一方、過去の震災後に進めた耐震化や事業継続投資が被害軽減に寄与した。`,`今後は設備の潜在損傷、余震、物流停滞による二次的な遅延が焦点となる。住民にとっては電気、水、避難所の安全が最優先である。`],vocab:[['earthquake','n.','/ˈɝːθkweɪk/','地震','地震（じしん）','an earthquake stopped production'],['inspection','n.','/ɪnˈspɛkʃən/','檢查','点検','after inspections'],['restart','v.','/ˌriːˈstɑːrt/','重新啟動','再開する','restart operations'],['supplier','n.','/səˈplaɪər/','供應商','供給業者','one supplier stops'],['delivery','n.','/dɪˈlɪvəri/','交付','納入','timed deliveries'],['upgrade','n.','/ˈʌpɡreɪd/','升級','改修','safety upgrades'],['aftershock','n.','/ˈæftərʃɑːk/','餘震','余震','watch aftershocks'],['shelter','n.','/ˈʃɛltər/','避難所','避難所','safe shelters']],phrases:[['halt operations','停止營運','操業を停止する','Several plants halted operations.'],['resume production','恢復生產','生産を再開する','The factory resumed production after checks.'],['supply-chain disruption','供應鏈中斷','供給網の混乱','The quake caused supply-chain disruption.'],['hidden damage','隱性損害','潜在的な損傷','Engineers looked for hidden damage.']],facts:'來源事實：地震造成多座工廠暫停或縮減營運，部分企業逐步復產。合理推論：備援投資降低衝擊，但物流與設備暗傷仍可能延長停工。對日本居民：短期要優先注意避難、供水與高溫風險。',quality:'Reuters 即時採訪，企業狀況可能快速更新；死亡與停工數字應以後續官方資訊為準。'},
{id:'e2',g:'en',lv:'B2',title:'MediaTek raises money for a bigger AI-chip push',source:'Reuters',author:'Reuters',date:'2026-07-31',mins:'8 min',url:'https://www.reuters.com/business/media-telecom/mediatek-plans-5-billion-financing-ai-data-center-chips-2026-07-31/',why:'台灣晶片公司從手機走向資料中心 ASIC，適合學習融資、產品組合與成長風險。',body:[`MediaTek plans a financing program of up to $5 billion as it accelerates investment in custom chips for AI data centers. The Taiwanese designer is best known for smartphone processors, but weak handset demand and rising component costs have increased the strategic value of diversification.`,`The company expects its first custom AI chip to enter production in the fourth quarter of 2026 and has raised its estimate of the relevant market in 2027. Management is targeting a meaningful share of that market and expects AI-chip revenue to become a major growth engine. Financing gives the company flexibility to fund research, working capital and long product cycles without relying only on current cash flow.`,`The opportunity is large but execution is difficult. Custom chips require close coordination with cloud customers, advanced packaging, memory supply and foundry capacity. Revenue can also be concentrated in a small number of buyers. A delayed tape-out or a customer’s change in architecture could move billions of dollars of expected sales.`,`Investors should therefore separate market size from captured value. Useful indicators include confirmed design wins, production yields, customer concentration, gross margin and whether smartphone weakness continues to offset AI growth.`],zh:[`聯發科規劃最高 50 億美元融資，加速投入 AI 資料中心客製晶片。手機需求疲弱與零件成本上升，使產品多角化更重要。`,`首款客製 AI 晶片預計於 2026 年第四季投產，公司上調 2027 年相關市場規模估計，並希望 AI 晶片成為主要成長引擎。融資可支應研發、營運資金與長週期產品開發。`,`機會很大，但執行難度高。客製晶片仰賴雲端客戶協作、先進封裝、記憶體與晶圓代工產能，且客戶集中度可能很高。`,`投資人應區分市場規模與真正可取得的價值，觀察設計導入、良率、客戶集中、毛利率，以及手機業務下滑是否抵銷 AI 成長。`],ja:[`MediaTekはAIデータセンター向けカスタム半導体への投資を加速するため、最大50億ドルの資金調達枠を計画している。スマホ需要の弱さが事業分散の必要性を高めた。`,`初のカスタムAIチップは2026年10～12月期の量産入りを予定する。資金調達により、研究開発、運転資金、長期の製品開発を柔軟に賄える。`,`ただし、ASICはクラウド顧客、先端パッケージ、メモリ、ファウンドリーとの緊密な連携を要し、顧客集中リスクも大きい。`,`市場規模ではなく、設計採用、歩留まり、顧客集中度、粗利益率、スマホ事業の減速を確認すべきである。`],vocab:[['financing','n.','/ˈfaɪnænsɪŋ/','融資','資金調達','a financing program'],['diversification','n.','/daɪˌvɝːsəfɪˈkeɪʃən/','多角化','多角化','strategic diversification'],['custom chip','n.','/ˈkʌstəm tʃɪp/','客製晶片','カスタム半導体','custom AI chip'],['working capital','n.','/ˈwɝːkɪŋ ˈkæpɪtəl/','營運資金','運転資金','fund working capital'],['tape-out','n.','/ˈteɪp aʊt/','設計定稿','テープアウト','a delayed tape-out'],['yield','n.','/jiːld/','良率','歩留まり','production yields'],['design win','n.','/dɪˈzaɪn wɪn/','設計導入','設計採用','confirmed design wins'],['gross margin','n.','/ɡroʊs ˈmɑːrdʒɪn/','毛利率','粗利益率','protect gross margin']],phrases:[['growth engine','成長引擎','成長エンジン','AI chips could become a growth engine.'],['capture value','取得價值','価値を獲得する','Market size does not guarantee captured value.'],['long product cycle','長產品週期','長い製品サイクル','Chips have a long product cycle.'],['customer concentration','客戶集中','顧客集中','Customer concentration raises risk.']],facts:'來源事實：公司提出 50 億美元融資計畫、AI 晶片量產與營收目標。作者觀點：AI 可改善產品組合。AI 推論：真正關鍵是設計導入與良率，而非總市場規模。',quality:'Reuters 根據公司財報與管理層說法；市場規模與營收目標屬前瞻性陳述，可能大幅變動。'},
{id:'e3',g:'en',lv:'B2',title:'Amazon’s cloud growth changes the debate over AI spending',source:'Reuters',author:'Reuters',date:'2026-07-31',mins:'9 min',url:'https://www.reuters.com/business/retail-consumer/amazon-jumps-aws-growth-soothes-fears-over-rising-ai-spending-2026-07-31/',why:'用財報數字理解資本支出、雲端成長與自由現金流之間的取捨。',body:[`Amazon’s shares rose sharply after AWS reported 37% quarterly revenue growth, its fastest pace in more than four years. The result eased concern that huge AI infrastructure spending would produce capacity before customers were ready to pay for it.`,`Amazon expects 2026 capital expenditure to rise to about $220 billion. Management says much of the new cloud capacity is being built against visible demand and that future capacity is already reserved. That distinction matters: spending tied to contracted workloads is less speculative than spending based only on forecasts.`,`Still, strong revenue growth does not remove the cash-flow problem. Amazon’s trailing free cash flow turned negative as investment accelerated. Data centers require chips, buildings, networking, power contracts and depreciation long before revenue fully arrives. Investors are accepting the pressure because AWS growth suggests monetization is catching up.`,`The comparison with other technology groups is instructive. Markets reward capital spending when management can show utilization, pricing power and customer commitments. They punish the same spending when the link to revenue remains vague. The next tests will be margins, the speed of capacity deployment and whether enterprise demand stays strong if economic growth slows.`],zh:[`AWS 單季營收成長 37%，創四年多最快速度，緩解市場對 AI 基礎設施超前建設的擔憂。`,`亞馬遜預估 2026 年資本支出約 2,200 億美元，管理層表示許多新增產能已有可見需求或預約。這比單純根據預測投資更有支撐。`,`但營收成長未消除現金流壓力。資料中心在收入完全實現前就要支付晶片、建築、網路與電力成本。`,`市場會獎勵能證明利用率、定價權與客戶承諾的資本支出；後續要看毛利、建置速度，以及景氣轉弱時企業需求是否持續。`],ja:[`AWSの四半期売上高は37％増となり、AIインフラの過剰投資懸念を和らげた。`,`Amazonは2026年の設備投資を約2200億ドルへ引き上げる見通しで、将来のクラウド容量の多くは既に需要が見えていると説明した。`,`ただし、投資加速でフリーキャッシュフローはマイナスとなった。データセンターは収益化より先に巨額の支出が発生する。`,`今後は稼働率、価格決定力、顧客契約、利益率、景気減速時の需要耐性が焦点となる。`],vocab:[['capital expenditure','n.','/ˈkæpɪtəl ɪkˈspɛndɪtʃər/','資本支出','設備投資','capital expenditure rises'],['capacity','n.','/kəˈpæsəti/','產能','容量','future capacity'],['contracted','adj.','/kənˈtræktɪd/','已簽約的','契約済みの','contracted workloads'],['speculative','adj.','/ˈspɛkjələtɪv/','投機性的','投機的な','less speculative'],['free cash flow','n.','/friː kæʃ floʊ/','自由現金流','フリーキャッシュフロー','negative free cash flow'],['depreciation','n.','/dɪˌpriːʃiˈeɪʃən/','折舊','減価償却','power and depreciation'],['utilization','n.','/ˌjuːtələˈzeɪʃən/','利用率','稼働率','show utilization'],['pricing power','n.','/ˈpraɪsɪŋ ˈpaʊər/','定價權','価格決定力','pricing power']],phrases:[['ease concerns','緩解擔憂','懸念を和らげる','The results eased investor concerns.'],['visible demand','可見需求','可視化された需要','Capacity is backed by visible demand.'],['monetization catches up','變現追上投資','収益化が追いつく','Monetization is catching up.'],['remain vague','仍不明確','曖昧なままである','The revenue link remains vague.']],facts:'來源事實：AWS 成長 37%、資本支出預估與自由現金流變化。作者觀點：結果緩解 AI 投資疑慮。合理推論：投資是否合理取決於利用率與已簽需求。',quality:'Reuters 財報分析；股價反應是短期市場訊號，不等於長期投資報酬已確定。'},
{id:'e4',g:'en',lv:'B2',title:'FDA seeks better evidence for digital health tools in drug trials',source:'FDA',author:'U.S. Food and Drug Administration',date:'2026-07-20',mins:'8 min',url:'https://www.fda.gov/science-research/science-and-research-special-topics/digital-health-technologies-dhts-drug-development',why:'了解穿戴裝置、遠端量測如何進入臨床試驗，以及驗證與公平性的限制。',body:[`The U.S. Food and Drug Administration opened a funding opportunity for projects studying digital health technologies in drug development. Examples include actigraphy, photography and contactless sensors. These tools may capture symptoms continuously and allow some trial data to be collected remotely.`,`The potential benefit is not simply convenience. Traditional clinic visits provide only occasional measurements, while sensors can reveal daily variation, early disease signals or treatment effects that patients may not report. Remote collection may also reduce travel and make participation easier for people who live far from research centers.`,`However, a digital measure is useful only when it is reliable, meaningful and connected to a clinical outcome. Devices can produce missing data, change behavior after software updates or work differently across skin tones, ages and living conditions. Researchers must compare digital measures with established assessments and document how data are cleaned and interpreted.`,`This is a funding opportunity, not proof that any specific device improves drug development. The strongest projects will show validation, patient relevance, privacy protection and plans for populations that have historically been underrepresented in trials.`],zh:[`FDA 開放研究補助，探索活動量測、攝影與非接觸式感測器等數位健康科技在藥物開發中的角色。`,`感測器可連續捕捉症狀與日常變化，也可能降低遠距參與門檻。`,`但數位量測必須可靠、具臨床意義，並處理缺失資料、軟體更新、膚色與年齡差異等偏差。`,`這只是補助機會，不代表特定裝置已被證明有效。高品質研究仍需驗證、隱私保護與多元族群設計。`],ja:[`FDAは、薬剤開発におけるデジタルヘルス技術の研究助成を公募した。活動量、画像、非接触センサーなどが対象となる。`,`センサーは連続的な症状変化を捉え、遠隔参加の負担を減らせる可能性がある。`,`一方、欠測、ソフト更新、肌の色、年齢、生活環境による性能差を検証しなければならない。`,`これは公募であり、個別機器の有効性を証明したものではない。妥当性、患者にとっての意味、プライバシー、多様な集団への配慮が必要だ。`],vocab:[['actigraphy','n.','/ækˈtɪɡrəfi/','活動量測','アクチグラフィー','actigraphy data'],['contactless','adj.','/ˈkɑːntæktləs/','非接觸式','非接触の','contactless sensors'],['continuous','adj.','/kənˈtɪnjuəs/','連續的','連続的な','continuous measurement'],['variation','n.','/ˌvɛriˈeɪʃən/','變異','変動','daily variation'],['clinical outcome','n.','/ˈklɪnɪkəl ˈaʊtkʌm/','臨床結果','臨床転帰','linked to an outcome'],['validation','n.','/ˌvæləˈdeɪʃən/','驗證','妥当性確認','show validation'],['underrepresented','adj.','/ˌʌndərˌrɛprɪˈzɛntɪd/','代表不足的','十分に代表されない','underrepresented groups'],['privacy','n.','/ˈpraɪvəsi/','隱私','プライバシー','privacy protection']],phrases:[['capture early signals','捕捉早期訊號','早期兆候を捉える','Sensors may capture early signals.'],['remote data acquisition','遠端資料取得','遠隔データ取得','Trials can use remote data acquisition.'],['established assessment','既有評估方法','確立された評価法','Compare with an established assessment.'],['patient relevance','對患者的意義','患者にとっての妥当性','The measure needs patient relevance.']],facts:'來源事實：FDA 公布 2026/7/20–8/20 的補助機會。AI 推論：連續量測可增加資訊密度，但偏差與驗證將決定可用性。醫療限制：不是臨床療效證據，也不是產品核准。',quality:'FDA 第一手官方資訊；頁面描述研究方向，沒有提供單一裝置的臨床效果。'},
{id:'e5',g:'en',lv:'C1',title:'AI earnings revive stocks, but bond markets tell a different story',source:'Reuters',author:'Reuters markets team',date:'2026-07-31',mins:'12 min',url:'https://www.reuters.com/world/china/global-markets-global-markets-2026-07-31/',why:'高階閱讀：同時整合科技財報、利率、油價、日圓與跨資產風險。',body:[`Global equities ended July with a renewed burst of optimism after strong cloud results from Amazon and Microsoft supported the case for continued AI investment. The Nasdaq rose as investors concluded that at least some of the extraordinary capital spending on chips and data centers was generating measurable revenue. Yet the same session contained several warnings against a simple risk-on narrative.`,`Long-dated U.S. Treasury yields reached multi-year highs after hawkish Federal Reserve commentary reinforced concern that inflation may remain above target. Higher yields raise the discount rate applied to future corporate cash flows, which is particularly important for technology firms whose valuations depend on distant profits. In other words, stronger AI revenue can support earnings expectations while tighter financial conditions simultaneously compress valuation multiples.`,`Oil prices posted their largest monthly gain since March as Middle East tension increased uncertainty around tanker movements and supply reliability. Energy inflation can feed into transport, manufacturing and household costs. It can also complicate central-bank decisions by lifting headline inflation even when domestic demand is slowing.`,`In foreign exchange, the yen strengthened after Japanese intervention, but analysts questioned whether intervention alone could reverse a trend driven by interest-rate differentials. The market reaction illustrates a broader principle: official action can change positioning and volatility quickly, but durable currency moves usually require alignment between policy signals, inflation dynamics and capital flows.`,`For portfolio analysis, the useful conclusion is not that AI optimism won or that rates won. Different assets are pricing different horizons. Equities focus on near-term cloud revenue; bonds focus on inflation credibility; oil reflects geopolitical supply risk; currencies reflect relative policy. A robust view must connect these channels rather than extrapolate from one index.`],zh:[`Amazon 與 Microsoft 的雲端成績強化 AI 投資論述，帶動全球股市，但同一交易日也出現多項警訊。`,`美國長天期公債殖利率升至多年高點。AI 收入可上修獲利預期，但較高折現率也會壓縮科技股估值。`,`中東緊張推升油價，能源通膨可能傳導至運輸、製造與家戶成本，也增加央行政策難度。`,`日圓在日本干預後走強，但若利差不變，單靠干預未必能形成持久趨勢。`,`跨資產分析不能只看單一指數：股票看雲端收入，債券看通膨可信度，油價看供給風險，匯率看相對政策。`],ja:[`AmazonとMicrosoftのクラウド業績がAI投資の収益化期待を高め、株式市場を押し上げた。しかし、同じ市場には逆方向のシグナルも存在した。`,`米長期金利は数年ぶりの高水準となった。AI収益は利益予想を押し上げる一方、割引率上昇はハイテク株の評価倍率を圧迫する。`,`中東情勢を背景に原油価格が上昇し、輸送・製造・家計コストへの波及が懸念される。`,`円は介入後に上昇したが、金利差が維持されれば持続性には疑問が残る。`,`株、債券、原油、為替は異なる時間軸を織り込むため、一つの指数だけで市場全体を判断すべきではない。`],vocab:[['renewed','adj.','/rɪˈnuːd/','重新出現的','再燃した','renewed optimism'],['hawkish','adj.','/ˈhɔːkɪʃ/','偏鷹派的','タカ派的な','hawkish commentary'],['discount rate','n.','/ˈdɪskaʊnt reɪt/','折現率','割引率','raise the discount rate'],['valuation multiple','n.','/ˌvæljuˈeɪʃən ˈmʌltəpəl/','估值倍數','評価倍率','compress multiples'],['headline inflation','n.','/ˈhɛdlaɪn ɪnˈfleɪʃən/','總體通膨','総合インフレ率','lift headline inflation'],['interest-rate differential','n.','/ˈɪntrəst reɪt ˌdɪfəˈrɛnʃəl/','利差','金利差','driven by differentials'],['durable','adj.','/ˈdʊrəbəl/','持久的','持続的な','durable currency moves'],['extrapolate','v.','/ɪkˈstræpəleɪt/','外推','外挿する','extrapolate from one index']],phrases:[['risk-on narrative','風險偏好敘事','リスクオンの物語','The session challenged a risk-on narrative.'],['compress multiples','壓縮估值倍數','評価倍率を縮小させる','Higher yields compress multiples.'],['feed into costs','傳導至成本','コストに波及する','Oil prices feed into costs.'],['price different horizons','反映不同期間','異なる時間軸を織り込む','Assets price different horizons.']],facts:'來源事實：股指、長債殖利率、油價與日圓在 7 月底的變化。作者觀點：AI 財報改善情緒，但通膨與利率形成制衡。AI 推論：跨資產應按不同時間軸拆解。',quality:'Reuters 市場綜述整合多個即時市場資料；單日價格不能直接證明中長期趨勢。'},
{id:'j1',g:'jp',lv:'N1+',title:'日銀据え置き後に読むべき「反応関数」',source:'日本銀行',author:'日本銀行／AI学習用リライト',date:'2026-07-31',mins:'10分',url:'https://www.boj.or.jp/mopo/mpmsche_minu/index.htm',why:'金融政策の決定内容と市場の読み方を、実務的な日本語で整理する。',jpbody:`日本銀行は7月末の金融政策決定会合で、政策運営の現状維持を決めた。市場参加者が注目すべきなのは、据え置きという結論そのものより、どの条件が整えば次の政策変更に動くのかという「反応関数」である。物価が一時的に上振れしても、賃金とサービス価格の持続性、期待インフレ率、輸入物価、景気の強さがそろわなければ、直ちに追加引き締めが必要とは限らない。逆に、円安やエネルギー高が家計のインフレ期待を押し上げ、企業の価格設定行動に定着すれば、政策対応を早める根拠となる。政策コミュニケーションでは、単一の数字より、複数指標の組み合わせとリスクの方向を示すことが重要だ。企業側は金利上昇の有無だけでなく、資金調達期間、変動金利比率、為替感応度、価格転嫁力を点検する必要がある。家計にとっては預金金利の上昇がプラスになる一方、住宅ローンや物価への影響は家計構造によって異なる。したがって、政策決定を「利上げか据え置きか」の二択で読むのではなく、次回までに何が観察され、どのリスクが強まるかを追うべきである。`,zh:`日銀維持政策不變時，重點不是「沒有升息」，而是未來在什麼條件下會改變。應同時看薪資、服務價格、通膨預期、匯率與景氣。企業需檢查浮動利率負債、匯率敏感度與轉嫁能力；家庭則要分別評估存款、房貸與物價影響。`,terms:[['反応関数','はんのうかんすう','政策反應函數','政策判断のルール','専門的で分析的'],['据え置き','すえおき','維持不變','現状維持','中立的'],['基調的','きちょうてき','基礎趨勢的','根底にある','政策文書的'],['価格転嫁','かかくてんか','價格轉嫁','コスト反映','企業分析で頻出'],['感応度','かんのうど','敏感度','影響の受けやすさ','定量分析的'],['引き締め','ひきしめ','緊縮','金融緩和の縮小','金融用語'],['上振れ','うわぶれ','高於預期','想定を上回る','予測比較'],['定着する','ていちゃくする','固定下來','根付く','持続性を含む'],['資金調達','しきんちょうたつ','資金籌措','資金を集める','ビジネス'],['二択','にたく','二選一','二つの選択肢','やや口語的']],coll:[['政策を据え置く','政策維持不變','「政策が据え置く」は不自然','日銀は政策を据え置いた。'],['リスクが上振れる','風險向上偏離','「リスクを上振れる」は不自然','物価リスクが上振れている。'],['価格に転嫁する','轉嫁至價格','「価格を転嫁する」は文脈注意','企業はコストを価格に転嫁した。'],['条件が整う','條件成熟','「条件を整う」は不自然','利上げの条件が整いつつある。']],facts:'一次資料：日銀の会合資料・公表予定。リライトは政策判断の読み方を整理したもので、将来の利上げを断定しない。'},
{id:'j2',g:'jp',lv:'専門',title:'GENIACが目指す企業データの「使える化」',source:'経済産業省',author:'経済産業省／AI学習用リライト',date:'2026-07-02',mins:'11分',url:'https://www.meti.go.jp/press/2026/07/20260702001/20260702001.html',why:'生成AIの競争力を、モデル性能ではなくデータ連携とガバナンスから考える。',jpbody:`経済産業省とNEDOはGENIACの新たな研究開発テーマとして、複数企業にまたがるデータエコシステムの構築を支援する。生成AIの性能向上では、公開ウェブデータだけでなく、企業が保有する業務データ、製造現場のセンサーデータ、専門家の判断履歴などが重要になる。ただし、データを集めれば価値が生まれるわけではない。形式の不統一、権利関係、営業秘密、個人情報、品質のばらつき、利用目的の曖昧さが障壁となる。実務では、誰がデータを提供し、誰が加工し、どの用途まで許可し、成果をどう配分するかを事前に設計しなければならない。また、AI-Ready化には欠損補完やラベル付けだけでなく、業務上の意味、更新頻度、責任主体を明確にするメタデータが欠かせない。成功指標も、データ件数やモデル精度だけでは不十分である。実運用での工数削減、意思決定速度、品質改善、参加企業の継続率まで測る必要がある。日本企業は現場データを強みとする一方、組織横断の共有が苦手とされる。GENIACの価値は補助金額よりも、企業間の信頼、契約、標準化を再利用可能な仕組みにできるかにある。`,zh:`GENIAC 新案重點是跨企業資料生態系。資料價值不只取決於數量，還取決於格式、權利、品質、目的與責任。AI-Ready 不只是清洗與標註，也要有業務語意、更新頻率與責任者的 metadata。成功指標應延伸到工時、決策速度、品質與參與企業續留。`,terms:[['使える化','つかえるか','轉為可實際使用','実用可能にする','やや造語的'],['データエコシステム','でーたえこしすてむ','資料生態系','データ連携基盤','政策・IT用語'],['営業秘密','えいぎょうひみつ','營業秘密','企業秘密','法務的'],['権利関係','けんりかんけい','權利關係','権利の帰属','契約文脈'],['ばらつき','ばらつき','差異／離散','不均一さ','口語から実務まで'],['責任主体','せきにんしゅたい','責任主體','責任を負う者','制度設計'],['欠損補完','けっそんほかん','缺失補值','欠測値の補完','データ分析'],['再利用可能','さいりようかのう','可重複利用','繰り返し使える','設計用語'],['継続率','けいぞくりつ','續留率','継続参加の割合','KPI'],['標準化','ひょうじゅんか','標準化','共通化','業務改革']],coll:[['データを横断的に活用する','跨域運用資料','「横断で活用」は口語的','部門をまたいでデータを横断的に活用する。'],['責任主体を明確にする','明確責任主體','「責任を明確する」は誤り','契約で責任主体を明確にする。'],['目的を事前に定める','預先界定目的','「目的を決められる」は意味が変わる','利用目的を事前に定める。'],['成果を配分する','分配成果','「成果を分ける」はやや幼い','参加者間で成果を配分する。']],facts:'一次資料：METI/NEDOの採択発表。本文は制度の実務的含意をAIが再構成しており、個別採択案件の成果を保証しない。'},
{id:'j3',g:'jp',lv:'N1',title:'災害報道を雑談と仕事の会話につなげる',source:'Reuters',author:'Reuters報道／AI学習用リライト',date:'2026-07-31',mins:'9分',url:'https://www.reuters.com/world/asia-pacific/death-toll-japan-earthquake-rises-34-2026-07-31/',why:'重いニュースを過度に断定せず、配慮ある会話とBCPの論点へつなげる練習。',jpbody:`大規模な地震の後は、被害状況や復旧見通しが短時間で更新される。雑談で触れる場合、数字を断定的に繰り返すより、「現地の安全が最優先ですね」「交通や物流への影響も心配です」のように、事実確認と配慮を両立させる表現が望ましい。職場では、災害を単なるニュースとして消費せず、自社の事業継続計画に引き寄せて考えることができる。例えば、主要取引先が一地域に集中していないか、代替輸送手段があるか、在宅勤務や安否確認の仕組みが実際に機能するかを確認する。今回、過去の震災後に実施した耐震化や設備更新が被害軽減に役立ったとの企業説明もある。これはBCPが文書作成ではなく、設備投資、訓練、権限移譲、情報共有の積み重ねであることを示す。一方、復旧の早さだけを企業評価に使うのは適切ではない。従業員の安全や地域インフラの状況によって、慎重な停止が必要な場合もある。会話では、復旧を急ぐ視点と、安全確認を優先する視点の両方を示すことで、バランスの取れた議論になる。`,zh:`談論災害新聞時，不宜只重複傷亡數字。可先表達對當地安全與生活的關心，再延伸至物流與 BCP。企業復產快不一定代表管理較好，安全停工也可能是正確決策。`,terms:[['安否確認','あんぴかくにん','確認平安','無事の確認','災害対応'],['事業継続計画','じぎょうけいぞくけいかく','營運持續計畫','BCP','経営用語'],['引き寄せて考える','ひきよせてかんがえる','拉回自身情境思考','自分事として考える','会話的'],['権限移譲','けんげんいじょう','授權','権限を委ねること','組織論'],['積み重ね','つみかさね','累積','蓄積','努力の継続'],['断定的','だんていてき','武斷的','言い切るような','注意を要する語感'],['配慮','はいりょ','體諒','気遣い','丁寧'],['代替手段','だいたいしゅだん','替代方案','別の手段','実務用語'],['慎重な停止','しんちょうなていし','審慎停工','安全を優先した停止','評価語'],['両立させる','りょうりつさせる','兼顧','同時に成り立たせる','課題解決']],coll:[['安全を最優先する','安全優先','「安全が最優先する」は誤り','現地では安全を最優先しています。'],['影響を見極める','判斷影響','「影響を見る」より分析的','物流への影響を見極めます。'],['自社に引き寄せる','拉回本公司情境','人に対しては不自然','論点を自社に引き寄せて考えます。'],['慎重な判断を要する','需要審慎判斷','「慎重の判断」は誤り','復旧には慎重な判断を要します。']],facts:'Reutersの災害・企業報道を基礎に、会話とBCP学習へ展開した。被害数字は更新され得るため、最新の公的発表を優先する。'}];
function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}function speak(t,l){const s=speechSynthesis;if(!s){alert('此瀏覽器不支援語音');return}s.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=+(localStorage.rate||1);const vs=s.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase()===l.toLowerCase())||vs.find(v=>v.lang.toLowerCase().startsWith(l.slice(0,2).toLowerCase()))||null;s.speak(u)}function b(t,l){return `<button class="speak" data-s="${esc(t).replace(/"/g,'&quot;')}" data-l="${l}" aria-label="播放 ${esc(t)}">🔊</button>`}function english(x){let paras=x.body.map((p,i)=>`<p class="enx">${p}</p><div class="trans"><div class="mini zhx"><b>繁中</b><p>${x.zh[i]}</p></div><div class="mini jax"><b>日本語</b><p>${x.ja[i]}</p></div></div>`).join('');let voc=x.vocab.map(v=>`<tr><td><b>${v[0]}</b>${b(v[0],'en-US')} <button class="mark" data-k="${x.id}-${v[0]}">待複習</button></td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td><td>${v[4]}</td><td>${v[5]}${b(v[5],'en-US')}</td></tr>`).join('');let ph=x.phrases.map(v=>`<tr><td><b>${v[0]}</b>${b(v[0],'en-US')}</td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}${b(v[3],'en-US')}</td></tr>`).join('');return `<article id="${x.id}" class="article"><section class="card"><div class="meta"><span class="pill">${x.lv}</span><span class="pill source">${x.source}</span><span>${x.author}</span><span>${x.date}</span><span>${x.mins}</span></div><h2>${x.title}</h2><p class="why"><b>選文理由：</b>${x.why}</p><a class="url" target="_blank" rel="noopener" href="${x.url}">原文 URL ↗</a></section><section class="card"><h3>AI learning article／AI 重寫學習文章</h3>${paras}</section><section class="card"><h3>Vocabulary 重要單字</h3><div class="scroll"><table><tr><th>Word</th><th>詞性</th><th>IPA</th><th>中文</th><th>日本語</th><th>文章用法</th></tr>${voc}</table></div></section><section class="card"><h3>Phrases／Collocations</h3><div class="scroll"><table><tr><th>搭配</th><th>中文</th><th>日本語</th><th>例句</th></tr>${ph}</table></div></section><section class="card"><h3>文法／長句拆解</h3><details><summary>因果與讓步</summary><p>先找主句，再標出 while / however / because 等連接詞。把「事實」與「作者評價」分開。</p></details><details><summary>名詞化結構</summary><p>capital expenditure、validation 等名詞常壓縮動作；閱讀時可還原為公司投資、研究者驗證。</p></details><details><summary>條件與風險</summary><p>when / if / unless 後通常是前提，不代表已發生。</p></details></section><section class="card consult"><h3>商務／顧問表達</h3><ol><li>The key issue is not the headline number, but the mechanism behind it.${b('The key issue is not the headline number, but the mechanism behind it.','en-US')}</li><li>We should separate confirmed facts from forward-looking assumptions.${b('We should separate confirmed facts from forward-looking assumptions.','en-US')}</li><li>The next step is to identify the indicators that would change our view.${b('The next step is to identify the indicators that would change our view.','en-US')}</li></ol></section><section class="card"><h3>理解與輸出</h3><ol><li>What is the main causal chain?</li><li>Which risk could change the conclusion?</li><li>Explain the article in 80–120 English words.</li></ol><details class="answer"><summary>答案提示</summary><p>Use: fact → mechanism → risk → what to watch. Answers may vary.</p></details></section><section class="card analysis"><h3>繁中內容解讀</h3><p>${x.facts}</p></section><section class="card quality"><h3>來源品質卡與限制</h3><p>${x.quality}</p></section></article>`}
function japanese(x){let terms=x.terms.map(v=>`<tr><td><b>${v[0]}</b>${b(v[0],'ja-JP')} <button class="mark" data-k="${x.id}-${v[0]}">待複習</button></td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td><td>${v[4]}</td></tr>`).join('');let coll=x.coll.map(v=>`<tr><td><b>${v[0]}</b>${b(v[0],'ja-JP')}</td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}${b(v[3],'ja-JP')}</td></tr>`).join('');return `<article id="${x.id}" class="article"><section class="card"><div class="meta"><span class="pill">${x.lv}</span><span class="pill source">${x.source}</span><span>${x.author}</span><span>${x.date}</span><span>${x.mins}</span></div><h2>${x.title}</h2><p class="why"><b>選文理由：</b>${x.why}</p><a class="url" target="_blank" rel="noopener" href="${x.url}">原文 URL ↗</a></section><section class="card"><h3>AI学習用リライト</h3><p class="jax">${x.jpbody}</p><div class="mini zhx"><h3>精準繁中解說</h3><p>${x.zh}</p></div></section><section class="card"><h3>高階用語</h3><div class="scroll"><table><tr><th>用語</th><th>讀音</th><th>中文</th><th>近義替換</th><th>語感</th></tr>${terms}</table></div></section><section class="card"><h3>固定搭配與不自然用法</h3><div class="scroll"><table><tr><th>搭配</th><th>中文</th><th>注意</th><th>例句</th></tr>${coll}</table></div></section><section class="card"><h3>長句拆解</h3><details><summary>主題與結論</summary><p>「何が／どうなる」を先に抜き出し、条件・例示・逆接を後から戻す。</p></details><details><summary>名詞修飾</summary><p>長い連体修飾は、修飾される名詞を先に特定する。</p></details><details><summary>評価と事実</summary><p>「必要がある」「望ましい」は評価であり、事実記述とは分ける。</p></details></section><section class="card consult"><h3>コンサル表現</h3><ol><li>結論から申し上げると、論点は三点です。${b('結論から申し上げると、論点は三点です。','ja-JP')}</li><li>事実と仮説を切り分けて整理します。${b('事実と仮説を切り分けて整理します。','ja-JP')}</li><li>短期影響と中長期影響を分けて考える必要があります。${b('短期影響と中長期影響を分けて考える必要があります。','ja-JP')}</li><li>現時点では断定せず、追加データを確認すべきです。${b('現時点では断定せず、追加データを確認すべきです。','ja-JP')}</li></ol></section><section class="card"><h3>要約訓練</h3><details><summary>100字要約</summary><p>${x.jpbody.slice(0,100)}…</p></details><details><summary>50字要約</summary><p>${x.jpbody.slice(0,50)}…</p></details><details><summary>1句要約</summary><p>結論と主要な条件を一文でまとめる。</p></details></section><section class="card"><h3>会話練習</h3><p><b>開場：</b>「このニュース、実務にも影響がありそうですね。」／「まず事実関係を整理してみましょう。」</p><p><b>追問：</b>「一番大きい前提は何でしょうか。」／「逆のシナリオは考えられますか。」</p><p><b>禮貌反對：</b>「ご指摘は理解できますが、現時点では別の見方も必要だと思います。」</p><p><b>雑談の種：</b>自分の生活への影響／会社の備え／海外との違い。</p></section><section class="card"><h3>理解與口頭表達</h3><ol><li>筆者が最も重視する条件は何ですか。</li><li>反対の立場からどのような指摘ができますか。</li><li>60秒で同僚に説明してください。</li></ol><details><summary>答案提示</summary><p>結論→根拠→限界→次に見る指標、の順で話す。</p></details></section><section class="card quality"><h3>來源品質卡與限制</h3><p>${x.facts}</p></section></article>`}
const en=document.getElementById('en'),jp=document.getElementById('jp'),nav=document.getElementById('nav');en.innerHTML=items.filter(x=>x.g==='en').map(english).join('');jp.innerHTML=items.filter(x=>x.g==='jp').map(japanese).join('');nav.innerHTML=items.map((x,i)=>`<button data-id="${x.id}" data-g="${x.g}" class="${i===0?'active':''}"><small>${x.lv}</small><br>${x.title}</button>`).join('');function open(id){speechSynthesis.cancel();document.querySelectorAll('.article').forEach(a=>a.classList.toggle('active',a.id===id));document.querySelectorAll('.nav button').forEach(a=>a.classList.toggle('active',a.dataset.id===id));let g=items.find(x=>x.id===id).g;document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===g));document.querySelectorAll('.tabs button').forEach(t=>t.classList.toggle('active',t.dataset.panel===g));let done=JSON.parse(localStorage.done||'[]');if(!done.includes(id)){done.push(id);localStorage.done=JSON.stringify(done)}update()}function update(){let d=JSON.parse(localStorage.done||'[]');document.getElementById('prog').textContent=`學習進度 ${d.length}/8`;document.getElementById('bar').style.width=(d.length/8*100)+'%'}document.addEventListener('click',e=>{let s=e.target.closest('[data-s]');if(s)speak(s.dataset.s,s.dataset.l);let n=e.target.closest('.nav button');if(n)open(n.dataset.id);let t=e.target.closest('.tabs button');if(t){let first=items.find(x=>x.g===t.dataset.panel);open(first.id)}let m=e.target.closest('.mark');if(m){m.classList.toggle('on');localStorage.setItem('mark-'+m.dataset.k,m.classList.contains('on')?'1':'0')}});document.querySelectorAll('.mark').forEach(m=>m.classList.toggle('on',localStorage.getItem('mark-'+m.dataset.k)==='1'));document.getElementById('rate').value=localStorage.rate||'1';document.getElementById('rate').onchange=e=>localStorage.rate=e.target.value;document.getElementById('stop').onclick=()=>speechSynthesis.cancel();document.getElementById('lang').value=localStorage.lang||'all';document.getElementById('lang').onchange=e=>{localStorage.lang=e.target.value;applyLang()};function applyLang(){let l=localStorage.lang||'all';document.querySelectorAll('.zhx').forEach(x=>x.style.display=l==='ja'?'none':'block');document.querySelectorAll('.jax').forEach(x=>x.style.display=l==='zh'?'none':'block');document.querySelectorAll('.enx').forEach(x=>x.style.display=l==='zh'||l==='ja'?'none':'block')}speechSynthesis.onvoiceschanged=()=>{let v=speechSynthesis.getVoices();document.getElementById('voice').textContent=`英語 ${v.some(x=>x.lang.startsWith('en'))?'✓':'—'}・日本語 ${v.some(x=>x.lang.startsWith('ja'))?'✓':'—'}`};open(localStorage.last&&items.some(x=>x.id===localStorage.last)?localStorage.last:'e1');applyLang();update();
</script></body></html>
