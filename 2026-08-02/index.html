<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日英日趨勢學習 2026-08-02</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:80px auto;padding:24px;line-height:1.7}.box{border:1px solid #d9e0eb;border-radius:16px;padding:22px;background:#f8fafc}</style></head><body><div class="box"><h1>正在載入晨報…</h1><p>若頁面沒有自動顯示，請重新整理一次。</p></div><script>(async()=>{try{const ps=await Promise.all([1,2,3,4,5].map(i=>fetch(`part${i}.txt`).then(r=>{if(!r.ok)throw new Error(`part${i}: ${r.status}`);return r.text()})));const b=Uint8Array.from(atob(ps.join('')),c=>c.charCodeAt(0));const s=new DecompressionStream('gzip');const t=await new Response(new Blob([b]).stream().pipeThrough(s)).text();document.open();document.write(t);document.close();}catch(e){document.body.innerHTML='<div class="box"><h1>無法載入</h1><p>'+e+'</p><p><a href="../archive/">返回歷史列表</a></p></div>';}})();</script></body></html>
